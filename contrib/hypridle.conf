# wayqlo hypridle snippet
#
# Add this listener block to your existing ~/.config/hypr/hypridle.conf.
# Adjust the timeout (seconds) to taste. wayqlo exits on its own on any
# keypress or mouse movement, but on-resume is included as a safety net
# in case it is still running when the session resumes some other way.

listener {
    timeout = 300
    on-timeout = wayqlo
    on-resume = pkill wayqlo
}
